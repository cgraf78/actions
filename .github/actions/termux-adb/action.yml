name: Stage bounded Termux ADB helper
description: Expose the provider-owned bounded ADB helper to reusable workflows

runs:
  using: composite
  steps:
    - name: Export helper path
      shell: bash
      run: |-
        set -euo pipefail
        helper="$GITHUB_ACTION_PATH/termux-adb.sh"
        wrapper_dir="$GITHUB_ACTION_PATH/bin"
        wrapper="$wrapper_dir/adb"
        real_adb=${TERMUX_ADB_REAL:-}
        if [[ -z "$real_adb" ]]; then
          real_adb=$(command -v adb)
        fi
        if [[ ! -f "$helper" || -L "$helper" ||
          ! -x "$wrapper" || -L "$wrapper" ||
          ! -x "$real_adb" || "$real_adb" == "$wrapper" ]]; then
          echo "Termux ADB support is missing or unsafe: $GITHUB_ACTION_PATH" >&2
          exit 1
        fi
        printf 'TERMUX_ADB_HELPER=%s\nTERMUX_ADB_REAL=%s\n' \
          "$helper" "$real_adb" >>"$GITHUB_ENV"
        printf '%s\n' "$wrapper_dir" >>"$GITHUB_PATH"
