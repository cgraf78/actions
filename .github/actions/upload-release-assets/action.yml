name: Upload release assets safely
description: Upload release assets idempotently with verification and bounded retries.

inputs:
  asset-glob:
    description: Caller-owned shell glob selecting release assets.
    required: true
  github-token:
    description: Token with contents write access to the target repository.
    required: true
  tag:
    description: Existing draft release tag.
    required: true
  working-directory:
    description: Directory from which to expand the asset glob.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Upload and verify release assets
      shell: bash
      env:
        ASSET_GLOB: ${{ inputs.asset-glob }}
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ inputs.tag }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |-
        cd "$WORKING_DIRECTORY"
        "$GITHUB_ACTION_PATH/upload.sh"
