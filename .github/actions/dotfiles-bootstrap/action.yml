name: Bootstrap dotfiles dependencies
description: Install Dot, locked Mise tools, and full-provider doctor checks for dotfiles CI.

inputs:
  mode:
    description: Full host bootstrap, staged payload creation, or staged payload installation.
    required: false
    default: full
  stage-directory:
    description: Absolute payload directory used by stage and install-staged modes.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install dependencies
      id: bootstrap
      shell: bash
      env:
        DOTFILES_BOOTSTRAP_MODE: ${{ inputs.mode }}
        DOTFILES_BOOTSTRAP_STAGE_DIR: ${{ inputs.stage-directory }}
      run: "$GITHUB_ACTION_PATH/install.sh"

    - name: Run doctor smoke checks
      if: inputs.mode == 'full' && env.DOT_INIT_SKIP_PROVIDER != '1'
      shell: bash
      run: .local/bin/dot doctor
