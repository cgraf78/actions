# Public interface for real Android/Termux runtime checks.
#
# Keep caller-facing policy here and Android/emulator mechanics in the internal
# worker. The relative call resolves the worker from the same actions commit,
# preserving the caller's outer SHA pin.

name: Termux CI

on:
  workflow_call:
    inputs:
      command:
        description: Bash command to execute inside the Termux app sandbox.
        required: true
        type: string
      host-command:
        description: Optional command that prepares checkout artifacts on the Ubuntu host.
        required: false
        type: string
        default: ""
      profiles:
        description: Comma-separated portable prerequisite profiles to install in Termux.
        required: false
        type: string
        default: ""
      rust-toolchain:
        description: Optional Rust toolchain for an x86_64 Android host build.
        required: false
        type: string
        default: ""
      setup:
        description: Named Shell setup mode; named modes receive only base Termux prerequisites.
        required: false
        type: string
        default: none
      working-directory:
        description: Checkout-relative directory where the command should run.
        required: false
        type: string
        default: .
    secrets:
      DEPENDENCY_GH_TOKEN:
        description: Optional GitHub token exposed to the host command.
        required: false

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime
    uses: ./.github/workflows/_termux-ci.yml
    with:
      command: ${{ inputs.command }}
      host-command: ${{ inputs.host-command }}
      profiles: ${{ inputs.profiles }}
      rust-toolchain: ${{ inputs.rust-toolchain }}
      setup: ${{ inputs.setup }}
      working-directory: ${{ inputs.working-directory }}
    secrets:
      DEPENDENCY_GH_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}

  required:
    name: Required
    if: ${{ always() }}
    needs: runtime
    runs-on: ubuntu-24.04
    env:
      RUNTIME_RESULT: ${{ needs.runtime.result }}
    steps:
      - name: Require successful Termux runtime
        shell: bash
        run: |-
          printf 'Runtime: %s\n' "$RUNTIME_RESULT"
          test "$RUNTIME_RESULT" = success
