name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "7 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-smoke:
    name: Shell smoke
    uses: ./.github/workflows/shell-ci.yml
    with:
      matrix-set: full
      profiles: base,procps
      shellcheck-inventory-path: .github/shellcheck-files.txt
      test-command: |
        test -f .github/workflows/shell-ci.yml
        test -f .github/workflows/_termux-ci.yml
        bash test/checkout-installer-test
      termux-command: |
        test "$(uname -o)" = Android
        test "$PREFIX" = /data/data/com.termux/files/usr
        test -x "$PREFIX/bin/bash"
        curl --version >/dev/null
        test -f .github/workflows/shell-ci.yml
        test -f .github/workflows/_termux-ci.yml
        bash test/checkout-installer-test
      termux-profiles: base,procps

  rust-smoke:
    name: Rust smoke
    uses: ./.github/workflows/rust-ci.yml
    with:
      matrix-set: auto
      working-directory: test/fixtures/rust-smoke
      test-command: cargo test --locked
      android-package-smoke-command: |
        cargo build --locked --target "$RUST_TARGET"
        binary="target/$RUST_TARGET/debug/actions-rust-smoke"
        readelf -h "$binary" | grep -Fq AArch64
        readelf -l "$binary" | grep -Fq /system/bin/linker64
      # Exercise the pure-Rust path deliberately: the target should be added,
      # while the host musl linker package remains skipped.
      package-smoke-musl-target: x86_64-unknown-linux-musl
      package-smoke-command: |
        cargo build --release --locked --target "$RUST_TARGET"
        readelf -h "target/$RUST_TARGET/release/actions-rust-smoke" |
          grep -Fq 'UNIX - System V'
      termux-host-command: |
        cargo build --locked --target "$RUST_TARGET" \
          --target-dir "$RUNNER_TEMP/actions-rust-smoke-target"
        mkdir -p .termux-ci
        install -m 0755 \
          "$RUNNER_TEMP/actions-rust-smoke-target/$RUST_TARGET/debug/actions-rust-smoke" \
          .termux-ci/actions-rust-smoke
      termux-command: |
        test "$(uname -o)" = Android
        test "$PREFIX" = /data/data/com.termux/files/usr
        test "$(.termux-ci/actions-rust-smoke)" = actions-rust-smoke

  matrix-contract:
    name: Matrix contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: core
        uses: ./.github/actions/platform-matrix
        with:
          matrix-set: core

      - id: full
        uses: ./.github/actions/platform-matrix
        with:
          matrix-set: full

      - id: invalid
        continue-on-error: true
        uses: ./.github/actions/platform-matrix
        with:
          matrix-set: unsupported

      - name: Check matrix outputs
        shell: bash
        env:
          CORE_MATRIX: ${{ steps.core.outputs.matrix }}
          FULL_MATRIX: ${{ steps.full.outputs.matrix }}
          INVALID_OUTCOME: ${{ steps.invalid.outcome }}
        run: |
          test "$(jq -c '[.include[].name]' <<<"$CORE_MATRIX")" = \
            '["macOS","CentOS Stream","Arch","Debian","Ubuntu"]'
          test "$(jq -c '[.include[].name]' <<<"$FULL_MATRIX")" = \
            '["macOS","CentOS Stream","Arch","Debian","Ubuntu","WSL","Fedora","Alpine"]'
          test "$INVALID_OUTCOME" = failure

  android-rust-toolchain:
    name: Android Rust toolchain
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - rust-target: aarch64-linux-android
            machine: AArch64
            cc-variable: CC_aarch64_linux_android
          - rust-target: x86_64-linux-android
            machine: X86-64
            cc-variable: CC_x86_64_linux_android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-target }}

      - name: Configure Android NDK toolchain
        uses: ./.github/actions/android-rust-toolchain
        with:
          rust-target: ${{ matrix.rust-target }}

      - name: Cross-build Android smoke binary
        shell: bash
        env:
          CC_VARIABLE: ${{ matrix.cc-variable }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
          RUST_TARGET: ${{ matrix.rust-target }}
        run: |
          cc=${!CC_VARIABLE}
          "$cc" --version
          crate="$RUNNER_TEMP/android-rust-smoke"
          cargo new --quiet --bin --vcs none "$crate"
          cargo build --manifest-path "$crate/Cargo.toml" --target "$RUST_TARGET"
          binary="$crate/target/$RUST_TARGET/debug/android-rust-smoke"
          readelf -h "$binary" | grep -Fq "$EXPECTED_MACHINE"
          readelf -l "$binary" | grep -Fq '/system/bin/linker64'

  release-installer-bash32:
    name: Release installer / Bash 3.2
    uses: ./.github/workflows/bash32-ci.yml
    with:
      command: /bin/bash test/release-installer-test

  checkout-installer-bash32:
    name: Checkout installer / Bash 3.2
    uses: ./.github/workflows/bash32-ci.yml
    with:
      command: /bin/bash test/checkout-installer-test
      provision_modern_bash: true
      pre_provision_command: /bin/bash test/checkout-installer-bash32-test

  release-asset-upload-bash32:
    name: Release asset upload / Bash 3.2
    uses: ./.github/workflows/bash32-ci.yml
    with:
      command: /bin/bash test/release-asset-upload-test

  quality:
    name: Quality / Ubuntu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify internal Actions sync
        uses: cgraf78/actions/.github/actions/verify-consumer-sync@1723f9c7a4edb4812257d6b7288bb676fb9d147e

      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          install_dir="$RUNNER_TEMP/actionlint"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"

          mkdir -p "$install_dir"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 1 \
            "$url" -o "$archive"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$install_dir" actionlint
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Install zizmor
        shell: bash
        env:
          ZIZMOR_VERSION: 1.29.0
        run: |
          venv="$RUNNER_TEMP/zizmor"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --upgrade pip
          "$venv/bin/python" -m pip install "zizmor==${ZIZMOR_VERSION}"
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: Install ShellCheck
        uses: ./.github/actions/shell-ci-prereqs
        with:
          matrix-name: Ubuntu
          profiles: base,shellcheck
          setup: none

      - name: Lint workflows
        shell: bash
        run: actionlint .github/workflows/*.yml

      - name: Audit workflows
        shell: bash
        run: zizmor --offline .github/workflows/*.yml

      - name: Check workflow contracts
        shell: bash
        run: test/workflow-contract-test

      - name: Test shell prerequisite profiles
        shell: bash
        run: test/shell-ci-prereqs-test

      - name: Test shared ShellCheck inventory action
        shell: bash
        run: test/shellcheck-action-test

      - name: Test public dotfiles dependencies
        shell: bash
        run: test/dotfiles-public-deps-test

      - name: Test dotfiles bootstrap transitions
        shell: bash
        run: test/dotfiles-bootstrap-test

      - name: Test infrastructure retry classification
        shell: bash
        run: test/infra-retry-test

      - name: Test shared release scripts
        shell: bash
        run: test/release-scripts-test

      - name: Test consumer synchronization
        shell: bash
        run: test/consumer-sync-test

      - name: Test generated release installer
        shell: bash
        run: test/release-installer-test

      - name: Test retry-safe release asset uploads
        shell: bash
        run: test/release-asset-upload-test

      - name: Test generated checkout installer
        shell: bash
        run: test/checkout-installer-test

      - name: Test musl build prerequisites
        shell: bash
        run: test/musl-prereqs-test

      - name: Lint shell inventory
        uses: ./.github/actions/shellcheck-inventory
        with:
          inventory-path: .github/shellcheck-files.txt

  required:
    name: Required
    if: ${{ always() }}
    needs: [shell-smoke, rust-smoke, matrix-contract, android-rust-toolchain, release-installer-bash32, checkout-installer-bash32, release-asset-upload-bash32, quality]
    runs-on: ubuntu-24.04
    env:
      SHELL_SMOKE_RESULT: ${{ needs.shell-smoke.result }}
      RUST_SMOKE_RESULT: ${{ needs.rust-smoke.result }}
      MATRIX_CONTRACT_RESULT: ${{ needs.matrix-contract.result }}
      ANDROID_TOOLCHAIN_RESULT: ${{ needs.android-rust-toolchain.result }}
      RELEASE_INSTALLER_BASH32_RESULT: ${{ needs.release-installer-bash32.result }}
      CHECKOUT_INSTALLER_BASH32_RESULT: ${{ needs.checkout-installer-bash32.result }}
      RELEASE_ASSET_UPLOAD_BASH32_RESULT: ${{ needs.release-asset-upload-bash32.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
    steps:
      - name: Require successful Actions CI
        shell: bash
        run: |-
          printf 'Shell smoke: %s\n' "$SHELL_SMOKE_RESULT"
          printf 'Rust smoke: %s\n' "$RUST_SMOKE_RESULT"
          printf 'Matrix contract: %s\n' "$MATRIX_CONTRACT_RESULT"
          printf 'Android toolchain: %s\n' "$ANDROID_TOOLCHAIN_RESULT"
          printf 'Release installer Bash 3.2: %s\n' "$RELEASE_INSTALLER_BASH32_RESULT"
          printf 'Checkout installer Bash 3.2: %s\n' "$CHECKOUT_INSTALLER_BASH32_RESULT"
          printf 'Release asset upload Bash 3.2: %s\n' "$RELEASE_ASSET_UPLOAD_BASH32_RESULT"
          printf 'Quality: %s\n' "$QUALITY_RESULT"
          test "$SHELL_SMOKE_RESULT" = success
          test "$RUST_SMOKE_RESULT" = success
          test "$MATRIX_CONTRACT_RESULT" = success
          test "$ANDROID_TOOLCHAIN_RESULT" = success
          test "$RELEASE_INSTALLER_BASH32_RESULT" = success
          test "$CHECKOUT_INSTALLER_BASH32_RESULT" = success
          test "$RELEASE_ASSET_UPLOAD_BASH32_RESULT" = success
          test "$QUALITY_RESULT" = success
