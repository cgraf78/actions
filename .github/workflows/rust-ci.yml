name: Rust CI

on:
  workflow_call:
    inputs:
      concurrency-scope:
        description: Stable identity that distinguishes multiple Rust CI calls in one caller workflow.
        required: false
        type: string
        default: default
      rust-toolchain:
        description: Rust toolchain to install for all checks.
        required: false
        type: string
        default: stable
      msrv-toolchain:
        description: Minimum supported Rust toolchain to check after stable quality checks. Empty disables it.
        required: false
        type: string
        default: ""
      msrv-command:
        description: Cargo command for the optional minimum-supported-Rust check. Empty disables it.
        required: false
        type: string
        default: cargo check --locked --all-targets --all-features
      matrix-set:
        description: Platform matrix to run. Supported values are auto, core, and full.
        required: false
        type: string
        default: auto
      working-directory:
        description: Directory where cargo commands should run.
        required: false
        type: string
        default: .
      setup-command:
        description: Optional setup command to run after Rust installation and before cargo commands.
        required: false
        type: string
        default: ""
      test-command:
        description: Rust test command to run on every selected platform.
        required: false
        type: string
        default: cargo test --locked
      fmt-command:
        description: Formatting command for the Ubuntu quality gate. Empty disables it.
        required: false
        type: string
        default: cargo fmt --check
      clippy-command:
        description: Clippy command for the Ubuntu quality gate. Empty disables it.
        required: false
        type: string
        default: cargo clippy --locked --all-targets --all-features -- -D warnings
      build-command:
        description: Build command for the Ubuntu quality gate. Empty disables it.
        required: false
        type: string
        default: cargo build --release --locked
      doc-command:
        description: Documentation command for the Ubuntu quality gate. Empty disables it.
        required: false
        type: string
        # All current Rust consumers treat undocumented public APIs as CI
        # failures. Keeping that fleet policy here prevents one caller from
        # silently losing the lint when its local command override drifts.
        default: RUSTDOCFLAGS='-D missing-docs' cargo doc --locked --no-deps
      audit-command:
        description: RustSec command run on every CI event. Empty disables advisory auditing.
        required: false
        type: string
        default: cargo audit --file Cargo.lock
      package-smoke-musl-target:
        description: Rust musl target to add before package-smoke-command. Empty disables target preparation.
        required: false
        type: string
        default: ""
      package-smoke-install-musl-tools:
        description: Install the host musl linker for package smoke. Needed only when a crate links native code.
        required: false
        type: boolean
        default: false
      package-smoke-setup-command:
        description: Optional setup command to run before package-smoke-command on the Ubuntu quality gate.
        required: false
        type: string
        default: ""
      package-smoke-command:
        description: Optional command that builds and validates a representative release artifact on the Ubuntu quality gate.
        required: false
        type: string
        default: ""
      android-package-smoke-command:
        description: Command that builds and validates the Android aarch64 release artifact.
        required: true
        type: string
      termux-command:
        description: Command to execute in the official Termux app on an Android emulator.
        required: true
        type: string
      termux-host-command:
        description: Optional command that cross-builds artifacts for the Termux emulator.
        required: false
        type: string
        default: ""
    secrets:
      DEPENDENCY_GH_TOKEN:
        description: Optional GitHub token exposed to caller commands as GH_TOKEN and GITHUB_TOKEN for private dependency downloads or rate-limit avoidance.
        required: false

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.concurrency-scope }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  platforms:
    name: Platforms
    # Push/PR runs use the shared high-signal platform subset. Scheduled/manual
    # runs expand to the full matrix, matching shell CI's event policy.
    # A relative reusable-workflow call resolves from this workflow's commit,
    # preserving the caller's outer SHA pin through the internal worker.
    uses: ./.github/workflows/_rust-platforms.yml
    secrets:
      DEPENDENCY_GH_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
    with:
      matrix-set: ${{ inputs.matrix-set != 'auto' && inputs.matrix-set || ((github.event_name == 'push' || github.event_name == 'pull_request') && 'core' || 'full') }}
      rust-toolchain: ${{ inputs.rust-toolchain }}
      working-directory: ${{ inputs.working-directory }}
      setup-command: ${{ inputs.setup-command }}
      test-command: ${{ inputs.test-command }}

  quality:
    name: Quality / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$(pwd)"

      - name: Install Rust
        timeout-minutes: 10
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          components: clippy, rustfmt

      - name: Run repo setup
        if: inputs.setup-command != ''
        timeout-minutes: 15
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
          MATRIX_NAME: Ubuntu
          SETUP_COMMAND: ${{ inputs.setup-command }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        # Run the same optional caller setup before quality commands so repos
        # with generated code or system prerequisites do not need a custom fork.
        run: |
          cd "$WORKING_DIRECTORY"
          eval "$SETUP_COMMAND"

      - name: Check formatting
        if: inputs.fmt-command != ''
        timeout-minutes: 10
        shell: bash
        env:
          FMT_COMMAND: ${{ inputs.fmt-command }}
          GH_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          cd "$WORKING_DIRECTORY"
          eval "$FMT_COMMAND"

      - name: Lint
        if: inputs.clippy-command != ''
        timeout-minutes: 15
        shell: bash
        env:
          CLIPPY_COMMAND: ${{ inputs.clippy-command }}
          GH_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          cd "$WORKING_DIRECTORY"
          eval "$CLIPPY_COMMAND"

      - name: Build release binary
        if: inputs.build-command != ''
        timeout-minutes: 20
        shell: bash
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
          GH_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        # Build is a separate quality gate from tests because binary repos need
        # to prove the optimized artifact compiles even when unit tests use the
        # debug profile. Callers still own the exact cargo invocation.
        run: |
          cd "$WORKING_DIRECTORY"
          eval "$BUILD_COMMAND"

      # Every cross-build needs the Rust target, but pure-Rust crates use Rust's
      # bundled musl support and do not need a host linker package. Keep those
      # concerns separate so only native-code consumers pay for an apt install.
      - name: Add package smoke Rust target
        if: inputs.package-smoke-command != '' && inputs.package-smoke-musl-target != ''
        timeout-minutes: 5
        shell: bash
        env:
          PACKAGE_SMOKE_MUSL_TARGET: ${{ inputs.package-smoke-musl-target }}
        run: rustup target add "$PACKAGE_SMOKE_MUSL_TARGET"

      - name: Install package smoke musl linker
        if: inputs.package-smoke-command != '' && inputs.package-smoke-musl-target != '' && inputs.package-smoke-install-musl-tools
        timeout-minutes: 10
        uses: cgraf78/actions/.github/actions/musl-build-prereqs@4f19231db8809e955d38761262bdf5c43b02d8f6

      - name: Prepare package smoke
        if: inputs.package-smoke-command != '' && inputs.package-smoke-setup-command != ''
        timeout-minutes: 15
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
          PACKAGE_SMOKE_SETUP_COMMAND: ${{ inputs.package-smoke-setup-command }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        # Keep package-specific prerequisites caller-owned. The shared workflow
        # provides a stable execution point but does not know whether a repo
        # needs signing tools, generated fixture data, or nothing at all.
        run: |
          cd "$WORKING_DIRECTORY"
          eval "$PACKAGE_SMOKE_SETUP_COMMAND"

      - name: Smoke release package
        if: inputs.package-smoke-command != ''
        timeout-minutes: 20
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
          PACKAGE_SMOKE_COMMAND: ${{ inputs.package-smoke-command }}
          RUST_TARGET: ${{ inputs.package-smoke-musl-target }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        # This is deliberately a command hook rather than a shared packager.
        # Archive layout, binary names, metadata, signatures, and install smoke
        # behavior are product contracts owned by the caller repository.
        run: |
          cd "$WORKING_DIRECTORY"
          eval "$PACKAGE_SMOKE_COMMAND"

      - name: Check public docs
        if: inputs.doc-command != ''
        timeout-minutes: 10
        shell: bash
        env:
          DOC_COMMAND: ${{ inputs.doc-command }}
          GH_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |-
          cd "$WORKING_DIRECTORY"
          eval "$DOC_COMMAND"

      # Keep the MSRV switch last: rust-toolchain changes the default compiler
      # for later steps. Running it after stable fmt, Clippy, packaging, and
      # docs gives callers one optional compatibility check without duplicating
      # the entire quality job or weakening the existing required check.
      - name: Install minimum supported Rust
        if: inputs.msrv-toolchain != '' && inputs.msrv-command != ''
        timeout-minutes: 10
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ inputs.msrv-toolchain }}

      - name: Check minimum supported Rust
        if: inputs.msrv-toolchain != '' && inputs.msrv-command != ''
        timeout-minutes: 15
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
          MSRV_COMMAND: ${{ inputs.msrv-command }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |-
          cd "$WORKING_DIRECTORY"
          eval "$MSRV_COMMAND"

  rustsec:
    name: RustSec advisory audit
    # Audit every committed lockfile before it can merge. Advisory data changes
    # independently of source, but allowing a known-vulnerable graph through a
    # PR and waiting for the nightly signal leaves main unnecessarily exposed.
    # Callers with an exceptional policy can still disable this explicitly.
    if: inputs.audit-command != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_AUDIT_VERSION: 0.22.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        timeout-minutes: 10
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}

      # Compiling this pinned tool consumed about three minutes in each daily
      # consumer run, while the audit itself took only a few seconds. Cache only
      # the resulting executable: caching Cargo's registry or build tree would
      # consume substantially more storage and create broader invalidation
      # concerns without improving the warm path.
      #
      # Do not add a restore prefix. The OS, architecture, exact immutable crate
      # release, and explicit cache epoch must all match before code is reused.
      # Pull requests may restore the default branch's exact cache. They do not
      # save misses below, avoiding a duplicate cache scoped to a short-lived PR.
      - name: Restore pinned cargo-audit
        id: cargo-audit-cache
        timeout-minutes: 5
        # Cache availability is an optimization, not an audit prerequisite.
        # Fall through to the source build on service or extraction failures.
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-bin-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_AUDIT_VERSION }}

      # Crates.io releases are immutable and --locked fixes the tool's own
      # dependency graph. Build outside the checkout so a consumer's local
      # Cargo configuration cannot influence the executable shared with future
      # runs. A miss remains the complete source-build fallback, so
      # cache service trouble costs time rather than weakening the audit.
      - name: Install cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        shell: bash
        env:
          CARGO_HTTP_TIMEOUT: "60"
          CARGO_NET_RETRY: "3"
        run: |
          rm -f "$HOME/.cargo/bin/cargo-audit"
          cd "$RUNNER_TEMP"
          cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked

      # Cache scope and the exact key above establish which trusted run produced
      # the bytes. This check catches a missing, unusable, or wrong-version
      # executable on both paths; increment the cache epoch to retire one.
      - name: Verify cargo-audit
        timeout-minutes: 2
        shell: bash
        run: |
          expected="cargo-audit $CARGO_AUDIT_VERSION"
          actual=$("$HOME/.cargo/bin/cargo-audit" --version)
          if [[ "$actual" != "$expected" ]]; then
            printf 'unexpected cargo-audit version: expected %s, got %s\n' \
              "$expected" "$actual" >&2
            exit 1
          fi

      # Save immediately after verification rather than in a post-job hook. A
      # newly discovered advisory should fail the audit below without throwing
      # away the verified tool and forcing another three-minute build tomorrow.
      - name: Save pinned cargo-audit
        timeout-minutes: 5
        if: >-
          steps.cargo-audit-cache.outputs.cache-hit != 'true' &&
          (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        # Cache availability is an optimization. A service or upload failure
        # must not discard the verified source build or skip the audit below.
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          # Repeat the exact key so even a restore action that fails before
          # publishing outputs cannot prevent the source-build fallback.
          key: cargo-audit-bin-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_AUDIT_VERSION }}

      - name: Audit the committed dependency graph
        timeout-minutes: 10
        shell: bash
        env:
          AUDIT_COMMAND: ${{ inputs.audit-command }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |-
          cd "$WORKING_DIRECTORY"
          eval "$AUDIT_COMMAND"

  android-package:
    name: Package / Android aarch64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          targets: aarch64-linux-android

      - name: Configure Android NDK toolchain
        uses: cgraf78/actions/.github/actions/android-rust-toolchain@4f19231db8809e955d38761262bdf5c43b02d8f6

      - name: Build and smoke Android package
        shell: bash
        env:
          ANDROID_PACKAGE_SMOKE_COMMAND: ${{ inputs.android-package-smoke-command }}
          ASSET_PLATFORM: android-aarch64
          GH_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
          RUST_TARGET: aarch64-linux-android
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |-
          cd "$WORKING_DIRECTORY"
          eval "$ANDROID_PACKAGE_SMOKE_COMMAND"

  termux:
    name: Termux runtime
    uses: ./.github/workflows/termux-ci.yml
    secrets:
      DEPENDENCY_GH_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
    with:
      command: ${{ inputs.termux-command }}
      host-command: ${{ inputs.termux-host-command }}
      profiles: runtime
      rust-toolchain: ${{ inputs.rust-toolchain }}
      working-directory: ${{ inputs.working-directory }}

  required:
    name: Required
    if: ${{ always() }}
    needs: [platforms, quality, rustsec, android-package, termux]
    runs-on: ubuntu-24.04
    env:
      ANDROID_PACKAGE_RESULT: ${{ needs.android-package.result }}
      PLATFORMS_RESULT: ${{ needs.platforms.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      # A deliberately disabled optional job is healthy only when skipped; an
      # enabled advisory audit is healthy only when successful. Encode that
      # distinction here so consumers keep one stable required-check context.
      RUSTSEC_ENABLED: ${{ inputs.audit-command != '' }}
      RUSTSEC_RESULT: ${{ needs.rustsec.result }}
      TERMUX_RESULT: ${{ needs.termux.result }}
    steps:
      - name: Require successful Rust CI
        shell: bash
        run: |-
          printf 'Platforms: %s\n' "$PLATFORMS_RESULT"
          printf 'Quality: %s\n' "$QUALITY_RESULT"
          printf 'RustSec advisory audit: %s (enabled: %s)\n' \
            "$RUSTSEC_RESULT" "$RUSTSEC_ENABLED"
          printf 'Android package: %s\n' "$ANDROID_PACKAGE_RESULT"
          printf 'Termux runtime: %s\n' "$TERMUX_RESULT"

          test "$PLATFORMS_RESULT" = success
          test "$QUALITY_RESULT" = success
          if [[ "$RUSTSEC_ENABLED" == true ]]; then
            test "$RUSTSEC_RESULT" = success
          else
            test "$RUSTSEC_RESULT" = skipped
          fi
          test "$ANDROID_PACKAGE_RESULT" = success
          test "$TERMUX_RESULT" = success
