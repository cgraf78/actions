# Internal worker for the public `termux-ci.yml` reusable workflow.
#
# GitHub requires reusable workflows to live under `.github/workflows`. Keep
# emulator provisioning, sandbox transport, and runtime execution here so the
# public file remains a stable caller contract.

name: Termux Runtime

on:
  workflow_call:
    inputs:
      command:
        description: Bash command to execute inside the Termux app sandbox.
        required: true
        type: string
      dotfiles-shdeps-update-policy:
        description: Dotfiles Shdeps policy override. Supported values are config, pinned, and latest.
        required: false
        type: string
        default: config
      host-command:
        description: Optional command that prepares checkout artifacts on the Ubuntu host.
        required: false
        type: string
        default: ""
      profiles:
        description: Comma-separated Termux prerequisite profiles; runtime is the lightweight baseline.
        required: false
        type: string
        default: runtime
      rust-toolchain:
        description: Optional Rust toolchain for an x86_64 Android host build.
        required: false
        type: string
        default: ""
      setup:
        description: Named Shell setup mode composed with the requested Termux profiles.
        required: false
        type: string
        default: none
      working-directory:
        description: Checkout-relative directory where the command should run.
        required: false
        type: string
        default: .
    secrets:
      DEPENDENCY_GH_TOKEN:
        description: Optional GitHub token exposed to the host command and the sandbox command as GH_TOKEN, and as GITHUB_TOKEN in place of the read-only workflow token.
        required: false

permissions:
  contents: read

jobs:
  termux:
    name: Android / Termux x86_64
    runs-on: ubuntu-24.04
    # Inner limits reserve at most 690s for SDK package installs (three 190s
    # attempts plus 120s of backoff), 600s for boot, and 2304s for sequential
    # ADB work, including the 1200s caller command, the bounded package-service
    # wait (about 119s), two 120s install attempts, and the 35s failure-only
    # crash-log dump. Keep at least five minutes of outer headroom for
    # checkout, downloads, host setup, and runner overhead.
    timeout-minutes: 67
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false

      - name: Stage exact Dot bootstrap payload
        if: inputs.setup == 'dotfiles'
        uses: cgraf78/actions/.github/actions/dotfiles-bootstrap@4fc302ac73cd253ded4eb3a82b8942245874457f
        env:
          HOME: ${{ github.workspace }}
        with:
          mode: stage
          stage-directory: ${{ runner.temp }}/dotfiles-bootstrap-payload

      - name: Install host Rust toolchain
        if: inputs.host-command != '' && inputs.rust-toolchain != ''
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          targets: x86_64-linux-android

      - name: Configure host Android NDK toolchain
        if: inputs.host-command != '' && inputs.rust-toolchain != ''
        uses: cgraf78/actions/.github/actions/android-rust-toolchain@4fc302ac73cd253ded4eb3a82b8942245874457f
        with:
          rust-target: x86_64-linux-android

      - name: Prepare host artifacts
        if: inputs.host-command != ''
        shell: bash
        env:
          ASSET_PLATFORM: android-x86_64
          GH_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN || github.token }}
          HOST_COMMAND: ${{ inputs.host-command }}
          RUST_TARGET: x86_64-linux-android
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          cd "$WORKING_DIRECTORY"
          eval "$HOST_COMMAND"

      - name: Download official Termux APK
        shell: bash
        env:
          TERMUX_APK_SHA256: 3550e61f4d9eb49b712fd1bd9519dc37085a4d8eb597c57a340f0a64859b7144
          TERMUX_APK_URL: https://github.com/termux/termux-app/releases/download/v0.118.3/termux-app_v0.118.3%2Bgithub-debug_x86_64.apk
        run: |
          apk="$RUNNER_TEMP/termux.apk"
          curl --fail --location --show-error --silent \
            --connect-timeout 10 --max-time 45 \
            --speed-limit 1024 --speed-time 30 \
            --retry 1 --retry-all-errors --retry-delay 1 \
            "$TERMUX_APK_URL" --output "$apk"
          printf '%s  %s\n' "$TERMUX_APK_SHA256" "$apk" | sha256sum --check --strict

      - name: Enable KVM acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator runner installs these itself with one unretried attempt
      # per package group, and a truncated archive download fails the job.
      # Installing them first with bounded retries leaves its own installs
      # only the small manifest fetch. Keep api-level, target, and arch equal
      # to the runner's; build-tools-version mirrors BUILD_TOOLS_VERSION in
      # lib/sdk-installer.js at the runner's pinned commit.
      # test/workflow-contract-test ties all four to that step and pin.
      - name: Install Android SDK packages
        uses: cgraf78/actions/.github/actions/android-sdk-packages@4fc302ac73cd253ded4eb3a82b8942245874457f
        with:
          api-level: 31
          target: default
          arch: x86_64
          build-tools-version: 37.0.0

      - name: Stage bounded Termux ADB helper
        uses: cgraf78/actions/.github/actions/termux-adb@4fc302ac73cd253ded4eb3a82b8942245874457f

      - name: Prepare Termux host runner
        shell: bash
        env:
          DOTFILES_BOOTSTRAP_PAYLOAD: ${{ runner.temp }}/dotfiles-bootstrap-payload
          DOTFILES_SHDEPS_UPDATE_POLICY: ${{ inputs.dotfiles-shdeps-update-policy }}
          PROFILES: ${{ inputs.profiles }}
          SETUP: ${{ inputs.setup }}
          TERMUX_CI_COMMAND: ${{ inputs.command }}
          # The sandbox command gets the same tokens as host commands. A
          # caller command that installs dependencies there (dotfiles runs
          # `dot update` with its provider) otherwise shares GitHub's
          # 60/hour anonymous quota with every job behind the runner's IP.
          TERMUX_CI_GH_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
          TERMUX_CI_GITHUB_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN || github.token }}
          TERMUX_CI_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          case "$DOTFILES_SHDEPS_UPDATE_POLICY" in
            config | pinned | latest) ;;
            *)
              printf 'unsupported Dotfiles Shdeps update policy: %s\n' \
                "$DOTFILES_SHDEPS_UPDATE_POLICY" >&2
              exit 2
              ;;
          esac
          profiles_b64=$(printf '%s' "$PROFILES" | base64 --wrap=0)
          policy_b64=$(printf '%s' "$DOTFILES_SHDEPS_UPDATE_POLICY" | base64 --wrap=0)
          setup_b64=$(printf '%s' "$SETUP" | base64 --wrap=0)
          workdir_b64=$(printf '%s' "$TERMUX_CI_WORKING_DIRECTORY" | base64 --wrap=0)
          payload_b64=$(printf '%s' "$DOTFILES_BOOTSTRAP_PAYLOAD" | base64 --wrap=0)
          payload_name=${DOTFILES_BOOTSTRAP_PAYLOAD##*/}
          case "$payload_name" in
            '' | . | .. | *[!A-Za-z0-9._-]*)
              echo "unsafe Dot bootstrap payload name: $payload_name" >&2
              exit 1
              ;;
          esac
          payload_name_b64=$(printf '%s' "$payload_name" | base64 --wrap=0)
          printf '%s' "$TERMUX_CI_COMMAND" >"$RUNNER_TEMP/termux-ci-command"
          # Tokens travel as owner-only files in the same copy as the command,
          # never in the runner script, which the job log echoes. The runner
          # exports and deletes them inside the sandbox before the command runs.
          (
            umask 077
            printf '%s' "$TERMUX_CI_GH_TOKEN" >"$RUNNER_TEMP/termux-ci-gh-token"
            printf '%s' "$TERMUX_CI_GITHUB_TOKEN" >"$RUNNER_TEMP/termux-ci-github-token"
          )
          # The runner echoes this script into the job log, so the in-sandbox
          # retry marker must arrive as data: written here literally, it would
          # make every failure after this step look retryable.
          # shellcheck source=/dev/null  # Provider helper, resolved at runtime.
          source "$TERMUX_ADB_HELPER"
          {
            printf '%s\n' '#!/data/data/com.termux/files/usr/bin/bash' 'set -euo pipefail'
            printf 'package_stall_marker=%q\n' "${TERMUX_PACKAGE_COMMAND_MARKER:?}"
            printf "profiles_b64='%s'\n" "$profiles_b64"
            printf "policy_b64='%s'\n" "$policy_b64"
            printf "setup_b64='%s'\n" "$setup_b64"
            printf "workdir_b64='%s'\n" "$workdir_b64"
            printf "payload_name_b64='%s'\n" "$payload_name_b64"
            cat <<'RUNNER'
          export HOME=/data/data/com.termux/files/home
          export PREFIX=/data/data/com.termux/files/usr
          export TMPDIR=$PREFIX/tmp
          # Take the copied tokens off disk first, so a setup failure below
          # cannot leave them behind; they are exported only for the command.
          gh_token=$(<"$TMPDIR/termux-ci-gh-token")
          github_token=$(<"$TMPDIR/termux-ci-github-token")
          rm -f "$TMPDIR/termux-ci-gh-token" "$TMPDIR/termux-ci-github-token"
          # Do not let the copied caller checkout substitute Bash or Git before
          # the exact staged runtime is installed. Keep bootstrap lookup limited
          # to Termux-owned tools; invoke the tracked client front door only
          # after that runtime exists.
          export PATH=$PREFIX/bin
          export TERMUX_PKG_NO_MIRROR_SELECT=1
          # The bootstrap APK otherwise probes mirrors and may select one with
          # stale indexes. Keep CI reproducible on Termux's primary repository.
          printf '%s\n' \
            'deb https://packages.termux.dev/apt/termux-main stable main' \
            >"$PREFIX/etc/apt/sources.list"
          profiles=$(printf %s "$profiles_b64" | base64 -d)
          dotfiles_shdeps_update_policy=$(printf %s "$policy_b64" | base64 -d)
          setup=$(printf %s "$setup_b64" | base64 -d)
          case "$setup" in
            none | checkrun | dotfiles) ;;
            *)
              printf 'unsupported Termux setup mode: %s\n' "$setup" >&2
              exit 2
              ;;
          esac
          if [[ "$setup" == dotfiles && "$dotfiles_shdeps_update_policy" != config ]]; then
            export DOT_SHDEPS_UPDATE_POLICY=$dotfiles_shdeps_update_policy
          fi
          # Match the conventional-platform named setup by composing the same
          # command capabilities. Keeping these as profiles preserves one
          # package-policy vocabulary across the two workers.
          if [[ "$setup" == dotfiles ]]; then
            profiles=${profiles:+$profiles,}cron,fd,ripgrep,hostname,python
          fi
          has_profile() {
            case ",$profiles," in
              *",$1,"*) return 0 ;;
              *) return 1 ;;
            esac
          }
          # Every runtime needs a trusted shell and Termux's exec-path shim.
          # `base` adds network/source-control tools for repository test suites;
          # `runtime` keeps smoke-only callers lean and avoids Git's OpenSSH
          # dependency and first-install host-key setup.
          packages=(bash termux-exec)
          if has_profile base || [[ "$setup" == dotfiles ]]; then
            packages+=(git curl)
          elif ! has_profile runtime; then
            echo "Termux profiles must include base or runtime" >&2
            exit 2
          fi
          has_profile jq && packages+=(jq)
          has_profile python && packages+=(python)
          has_profile zsh && packages+=(zsh)
          has_profile lua && packages+=(lua54)
          has_profile neovim && packages+=(neovim)
          has_profile tmux && packages+=(tmux)
          has_profile openssh-netcat-lsof &&
            packages+=(openssh netcat-openbsd lsof)
          has_profile procps && packages+=(procps)
          has_profile cron && packages+=(cronie)
          has_profile fd && packages+=(fd)
          has_profile ripgrep && packages+=(ripgrep)
          has_profile hostname && packages+=(inetutils)
          # Termux's rolling shellcheck package has intermittently omitted its
          # runtime library edge; request it explicitly so a successful install
          # cannot leave an executable that fails before caller lint begins.
          has_profile shellcheck && packages+=(shellcheck libandroid-utimes)
          termux_pkg() {
            local rc
            if timeout -k 5 120 "$@"; then
              return 0
            else
              rc=$?
            fi
            # Apt owns two transport retries inside this supervised attempt.
            # Only the supervisor deadline opts the workflow into one failed-
            # job rerun; dependency/conflict failures remain terminal.
            if [[ "$rc" -eq 124 ]]; then
              printf '%s\n' "$package_stall_marker" >&2
            fi
            return "$rc"
          }
          apt_net_opts=(
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o Acquire::Retries=2
          )
          termux_pkg apt-get "${apt_net_opts[@]}" update
          # The pinned APK can predate the live Termux repository. Termux does
          # not support partial upgrades: installing a current executable
          # beside bootstrap-era shared libraries can leave it unable to link.
          # Converge the base image first, then install caller capabilities.
          DEBIAN_FRONTEND=noninteractive termux_pkg apt-get \
            "${apt_net_opts[@]}" \
            -o Dpkg::Options::=--force-confold \
            full-upgrade -y
          DEBIAN_FRONTEND=noninteractive termux_pkg apt-get \
            "${apt_net_opts[@]}" \
            -o Dpkg::Options::=--force-confold \
            install -y "${packages[@]}"
          termux_exec_lib="$PREFIX/lib/libtermux-exec.so"
          if [[ ! -f "$termux_exec_lib" ]]; then
            termux_exec_lib="$PREFIX/lib/libtermux-exec-ld-preload.so"
          fi
          [[ -f "$termux_exec_lib" ]] || {
            echo "termux-exec preload library is unavailable" >&2
            exit 1
          }
          export LD_PRELOAD="$termux_exec_lib"
          project_root=$(cd "$HOME/project" && pwd -P)
          if [[ "$setup" == dotfiles ]]; then
            payload_name=$(printf %s "$payload_name_b64" | base64 -d)
            case "$payload_name" in
              '' | . | .. | *[!A-Za-z0-9._-]*)
                echo "unsafe Dot bootstrap payload name: $payload_name" >&2
                exit 1
                ;;
            esac
            dotfiles_payload=$TMPDIR/$payload_name
            [[ -d "$dotfiles_payload" && ! -L "$dotfiles_payload" &&
              -f "$dotfiles_payload/bootstrap.sh" &&
              ! -L "$dotfiles_payload/bootstrap.sh" ]] || {
              echo "Dot bootstrap payload is unavailable: $dotfiles_payload" >&2
              exit 1
            }
            # install-staged binds the managed checkout to this exact file URL.
            # Preserve the same spelling for the caller's later provider run;
            # Shdeps intentionally rejects equivalent-looking origin drift.
            export SHDEPS_DOT_REPO="file://$dotfiles_payload/dot-origin.git"
            (
              cd "$project_root"
              HOME="$project_root" \
                DOT_INIT_SKIP_PROVIDER=1 \
                DOTFILES_BOOTSTRAP_MODE=install-staged \
                DOTFILES_BOOTSTRAP_STAGE_DIR="$dotfiles_payload" \
                "$PREFIX/bin/bash" "$dotfiles_payload/bootstrap.sh"
            )
            [[ -x "$project_root/.local/share/cgraf78/dot/bin/dot" ]] || {
              echo 'standalone Dot runtime was not installed' >&2
              exit 1
            }
          fi
          workdir=$(printf %s "$workdir_b64" | base64 -d)
          workdir_path=$(cd "$project_root/$workdir" && pwd -P)
          case "$workdir_path" in
            "$project_root"|"$project_root"/*) ;;
            *) echo "working-directory escapes checkout" >&2; exit 1 ;;
          esac
          cd "$workdir_path"
          # Empty files mean no token; GH_TOKEN stays the explicit dependency
          # token and GITHUB_TOKEN may be the read-only workflow fallback, the
          # same precedence host commands get.
          [[ -z "$gh_token" ]] || export GH_TOKEN="$gh_token"
          [[ -z "$github_token" ]] || export GITHUB_TOKEN="$github_token"
          unset gh_token github_token
          bash -euo pipefail "$TMPDIR/termux-ci-command"
          RUNNER
          } >"$RUNNER_TEMP/termux-ci-runner"
          {
            printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail'
            printf "setup_b64='%s'\n" "$setup_b64"
            printf "payload_b64='%s'\n" "$payload_b64"
            printf "payload_name_b64='%s'\n" "$payload_name_b64"
            cat <<'SCRIPT'
          source "$TERMUX_ADB_HELPER"
          # The host copies of the tokens go on every exit path, including a
          # failed copy into the sandbox.
          trap 'rm -f "$RUNNER_TEMP/termux-ci-gh-token" "$RUNNER_TEMP/termux-ci-github-token"; termux_dump_crash_log 30' EXIT
          apk="$RUNNER_TEMP/termux.apk"
          echo "Waiting for the package manager service"
          if ! termux_wait_for_package_service 20 5 1; then
            echo "Package manager service did not become ready" >&2
            exit 1
          fi
          echo "Installing Termux APK"
          if ! termux_install_apk 2 120 5 "$apk"; then
            echo "Termux APK install failed after bounded retries" >&2
            exit 1
          fi
          echo "Launching Termux"
          termux_adb 30 shell am start -n com.termux/.app.TermuxActivity

          echo "Waiting for Termux bootstrap"
          if ! termux_wait_for_runtime 30 3 1; then
            # Older infra-retry controllers matched the former wording of
            # this line in the echoed script, retrying every later failure.
            echo "Termux bootstrap was not ready after bounded polling" >&2
            exit 1
          fi

          echo "Copying caller checkout"
          termux_adb 30 shell run-as com.termux \
            mkdir -p files/home/project files/usr/tmp
          tar -C "$GITHUB_WORKSPACE" -cf - . |
            termux_adb 120 shell run-as com.termux \
              tar -C files/home/project -xf -

          setup=$(printf %s "$setup_b64" | base64 -d)
          if [[ "$setup" == dotfiles ]]; then
            dotfiles_payload=$(printf %s "$payload_b64" | base64 -d)
            payload_name=$(printf %s "$payload_name_b64" | base64 -d)
            case "$payload_name" in
              '' | . | .. | *[!A-Za-z0-9._-]*)
                echo "unsafe Dot bootstrap payload name: $payload_name" >&2
                exit 1
                ;;
            esac
            [[ ${dotfiles_payload##*/} == "$payload_name" ]] || {
              echo 'Dot bootstrap payload name does not match its source path' >&2
              exit 1
            }
            payload_parent=${dotfiles_payload%/*}
            [[ -n "$payload_parent" && "$payload_parent" != "$dotfiles_payload" &&
              -d "$payload_parent" && ! -L "$payload_parent" &&
              -d "$dotfiles_payload" && ! -L "$dotfiles_payload" &&
              -f "$dotfiles_payload/payload-v1" &&
              ! -L "$dotfiles_payload/payload-v1" &&
              -f "$dotfiles_payload/bootstrap.sh" &&
              ! -L "$dotfiles_payload/bootstrap.sh" &&
              -d "$dotfiles_payload/dot-origin.git" &&
              ! -L "$dotfiles_payload/dot-origin.git" ]] || {
              echo "Dot bootstrap payload is unsafe: $dotfiles_payload" >&2
              exit 1
            }
            # `test -e` is false for a dangling symlink. Reject `-L`
            # separately so extraction preserves the no-clobber boundary for
            # every existing path type.
            if termux_adb 30 shell run-as com.termux \
              test -e "files/usr/tmp/$payload_name" ||
              termux_adb 30 shell run-as com.termux \
                test -L "files/usr/tmp/$payload_name"; then
              echo "Termux Dot bootstrap destination already exists: $payload_name" >&2
              exit 1
            fi
            echo "Copying exact Dot bootstrap payload"
            tar -C "$payload_parent" -cf - "$payload_name" |
              termux_adb 120 shell run-as com.termux \
                tar -C files/usr/tmp -xf -
          fi

          echo "Copying Termux runner"
          tar -C "$RUNNER_TEMP" -cf - termux-ci-command termux-ci-runner \
            termux-ci-gh-token termux-ci-github-token |
            termux_adb 30 shell run-as com.termux tar -C files/usr/tmp -xf -

          echo "Running caller command inside Termux"
          termux_adb 1200 shell run-as com.termux \
            files/usr/bin/bash files/usr/tmp/termux-ci-runner
          SCRIPT
          } >"$RUNNER_TEMP/termux-ci-host.sh"
          chmod 0700 "$RUNNER_TEMP/termux-ci-host.sh"

      - name: Run caller tests in Termux
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          # Android 11's GWP-ASan samples about 1 in 128 processes and
          # right-aligns about half of its guarded `malloc` blocks against a
          # guard page with only 8-byte alignment. Rust's System allocator
          # trusts `malloc` for 16-byte alignment, so hashbrown's aligned SSE2
          # loads (`movdqa`) fault at random on x86_64. Android 12's bionic
          # asks GWP-ASan for 16-byte alignment.
          api-level: 31
          arch: x86_64
          target: default
          disable-animations: true
          emulator-boot-timeout: 600
          # `-no-metrics` answers the emulator's metrics-consent banner, which it
          # prints as a "WARNING - ACTION REQUIRED" block on every launch and
          # plans to turn into a blocking prompt. It keeps collection off.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash "$RUNNER_TEMP/termux-ci-host.sh"
