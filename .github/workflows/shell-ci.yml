name: Shell CI

on:
  workflow_call:
    inputs:
      concurrency-scope:
        description: Stable identity that distinguishes multiple shell CI calls in one caller workflow.
        required: false
        type: string
        default: default
      force-dotfiles-update:
        description: Refresh the shdeps bootstrap before dotfiles dependency resolution.
        required: false
        type: boolean
        default: false
      dotfiles-provider:
        description: Run the configured Dot dependency provider during dotfiles setup.
        required: false
        type: boolean
        default: false
      profiles:
        description: Comma-separated dependency profiles for normal shell-tool repos.
        required: false
        type: string
        default: ""
      shellcheck-inventory-path:
        description: Optional repository-relative ShellCheck inventory. Empty disables the lint job.
        required: false
        type: string
        default: ""
      shellcheck-exclude-codes:
        description: Optional comma-separated ShellCheck codes excluded only from the shared lint job.
        required: false
        type: string
        default: ""
      matrix-set:
        description: Platform matrix to run. Supported values are auto, core, and full.
        required: false
        type: string
        default: auto
      setup:
        description: Named setup mode. Supported values are none, checkrun, and dotfiles.
        required: false
        type: string
        default: none
      test-command:
        description: Command to run after checkout and setup.
        required: true
        type: string
      termux-command:
        description: Optional Android-specific test command. Empty reuses test-command.
        required: false
        type: string
        default: ""
      termux-host-command:
        description: Optional command that prepares checkout artifacts for Termux.
        required: false
        type: string
        default: ""
      termux-profiles:
        description: Optional Termux profiles. Empty reuses profiles, then falls back to runtime.
        required: false
        type: string
        default: ""
    secrets:
      DEPENDENCY_GH_TOKEN:
        description: Optional GitHub token exposed to caller commands as GH_TOKEN and GITHUB_TOKEN for private dependency downloads or rate-limit avoidance.
        required: false

permissions:
  contents: read

concurrency:
  group: shell-ci-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.concurrency-scope }}
  cancel-in-progress: true

jobs:
  platforms:
    name: Platforms
    # Push/PR runs cover the high-signal platform set. Scheduled/manual runs
    # use the full matrix for broader drift coverage. Keeping this as one job
    # avoids GitHub showing a skipped "full matrix" job on every normal push.
    # A relative reusable-workflow call resolves from this workflow's commit,
    # preserving the caller's outer SHA pin through the internal worker.
    uses: ./.github/workflows/_shell-platforms.yml
    secrets:
      DEPENDENCY_GH_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
    with:
      dotfiles-provider: ${{ inputs.dotfiles-provider }}
      force-dotfiles-update: ${{ inputs.force-dotfiles-update }}
      matrix-set: ${{ inputs.matrix-set != 'auto' && inputs.matrix-set || ((github.event_name == 'push' || github.event_name == 'pull_request') && 'core' || 'full') }}
      profiles: ${{ inputs.profiles }}
      setup: ${{ inputs.setup }}
      test-command: ${{ inputs.test-command }}

  shellcheck:
    name: ShellCheck
    if: ${{ inputs.shellcheck-inventory-path != '' }}
    runs-on: ubuntu-24.04
    # This path only installs prerequisites, checks out the caller, and runs
    # ShellCheck. A cap catches a silent prerequisite download without letting
    # it hold the required aggregate indefinitely.
    timeout-minutes: 15
    steps:
      - name: Install ShellCheck prerequisites
        # Keep this in step with the platform prerequisite cap. The shared
        # retry controller recognizes this named network-bootstrap timeout.
        timeout-minutes: 10
        uses: cgraf78/actions/.github/actions/shell-ci-prereqs@6dbd54f28872490ac3e76ec1f19bea91da74171c
        with:
          matrix-name: Ubuntu
          profiles: base,shellcheck
          setup: none

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the read-only workflow token in caller Git config.
          persist-credentials: false

      - name: Validate and lint shell inventory
        uses: cgraf78/actions/.github/actions/shellcheck-inventory@6dbd54f28872490ac3e76ec1f19bea91da74171c
        with:
          inventory-path: ${{ inputs.shellcheck-inventory-path }}
          exclude-codes: ${{ inputs.shellcheck-exclude-codes }}

  termux:
    name: Termux
    uses: ./.github/workflows/termux-ci.yml
    secrets:
      DEPENDENCY_GH_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
    with:
      command: ${{ inputs.termux-command != '' && inputs.termux-command || inputs.test-command }}
      host-command: ${{ inputs.termux-host-command }}
      profiles: ${{ inputs.termux-profiles != '' && inputs.termux-profiles || (inputs.profiles != '' && inputs.profiles || 'runtime') }}
      setup: ${{ inputs.setup }}

  required:
    name: Required
    if: ${{ always() }}
    needs: [platforms, shellcheck, termux]
    runs-on: ubuntu-24.04
    env:
      PLATFORMS_RESULT: ${{ needs.platforms.result }}
      SHELLCHECK_ENABLED: ${{ inputs.shellcheck-inventory-path != '' }}
      SHELLCHECK_RESULT: ${{ needs.shellcheck.result }}
      TERMUX_RESULT: ${{ needs.termux.result }}
    steps:
      - name: Require successful Shell CI
        shell: bash
        run: |-
          printf 'Platforms: %s\n' "$PLATFORMS_RESULT"
          printf 'ShellCheck: %s (enabled: %s)\n' \
            "$SHELLCHECK_RESULT" "$SHELLCHECK_ENABLED"
          printf 'Termux: %s\n' "$TERMUX_RESULT"
          test "$PLATFORMS_RESULT" = success
          if [[ "$SHELLCHECK_ENABLED" == true ]]; then
            test "$SHELLCHECK_RESULT" = success
          else
            test "$SHELLCHECK_RESULT" = skipped
          fi
          test "$TERMUX_RESULT" = success
