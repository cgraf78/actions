name: Rust Release

on:
  workflow_call:
    inputs:
      rust-toolchain:
        description: Rust toolchain to install for release validation and builds.
        required: false
        type: string
        default: stable
      working-directory:
        description: Directory where release commands should run.
        required: false
        type: string
        default: .
      setup-command:
        description: Optional setup command to run after checkout and before release commands.
        required: false
        type: string
        default: ""
      version-command:
        description: Command that prints the crate/package version without a leading tag prefix.
        required: false
        type: string
        default: cargo pkgid | sed 's/.*@//'
      tag-command:
        description: Optional command that prints the exact Git tag expected for this release. When set, version-command and tag-prefix are ignored for validation.
        required: false
        type: string
        default: ""
      tag-prefix:
        description: Prefix used before the package version in Git tags.
        required: false
        type: string
        default: v
      package-command:
        description: Command that builds release assets for RUST_TARGET and ASSET_PLATFORM.
        required: false
        type: string
        default: scripts/package-release.sh "$RUST_TARGET" "$ASSET_PLATFORM"
      smoke-command:
        description: Optional command that validates the built archive for ASSET_PLATFORM.
        required: false
        type: string
        default: ""
      asset-glob:
        description: Space-separated shell globs to upload after packaging.
        required: false
        type: string
        default: dist/*.tar.gz dist/*.sha256
      release-title:
        description: Release title. Defaults to the Git tag when empty.
        required: false
        type: string
        default: ""
      generate-notes:
        description: Ask GitHub to generate release notes when creating the draft.
        required: false
        type: boolean
        default: true
      prerelease:
        description: Mark the release as a prerelease.
        required: false
        type: boolean
        default: false
      publish:
        description: Publish the draft release after all assets upload.
        required: false
        type: boolean
        default: true
      latest:
        description: Mark the published release as latest when publish is true.
        required: false
        type: boolean
        default: true
      install-musl-tools:
        description: Install the musl linker toolchain before packaging Linux musl targets. Needed when any crate links C code.
        required: false
        type: boolean
        default: false
      android-aarch64:
        description: Build and publish the Android aarch64 release artifact.
        required: false
        type: boolean
        default: false
      android-x86_64:
        description: Build and publish the Android x86_64 release artifact.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create release draft
    runs-on: ubuntu-24.04
    # Release creation is the first write boundary. Checkout and validation keep
    # persisted credentials off even though this job can create the draft.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}

      - name: Run repo setup
        if: inputs.setup-command != ''
        shell: bash
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          cd "$WORKING_DIRECTORY"
          eval "$SETUP_COMMAND"

      - name: Validate tag version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TAG_COMMAND: ${{ inputs.tag-command }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          VERSION_COMMAND: ${{ inputs.version-command }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          cd "$WORKING_DIRECTORY"
          if [[ -n "$TAG_COMMAND" ]]; then
            # Some tools have release identities that are not Cargo package
            # versions, such as commit-versioned CLIs that still publish
            # human-facing distribution tags. Let those repos define the exact
            # tag while keeping semver crates on the default prefix contract.
            expected_tag=$(eval "$TAG_COMMAND")
          else
            release_version=$(eval "$VERSION_COMMAND")
            expected_tag="${TAG_PREFIX}${release_version}"
          fi
          if [[ "$TAG" != "$expected_tag" ]]; then
            echo "release tag ${TAG} does not match expected tag ${expected_tag}" >&2
            exit 1
          fi

      - name: Create draft release
        shell: bash
        env:
          GENERATE_NOTES: ${{ inputs.generate-notes }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_TITLE: ${{ inputs.release-title }}
          TAG: ${{ github.ref_name }}
        run: |
          retry_delays=${RELEASE_GH_RETRY_DELAYS:-1,3}
          IFS=, read -r -a delays <<<"$retry_delays"
          error=$(mktemp)
          trap 'rm -f "$error"' EXIT

          release_state() {
            local is_draft status
            set +e
            is_draft=$(timeout -k 5 "${RELEASE_GH_TIMEOUT_SECONDS:-120}" \
              gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq .isDraft 2>"$error")
            status=$?
            set -e
            if ((status == 0)); then
              [[ "$is_draft" == true ]] && printf 'draft\n' || printf 'published\n'
            elif grep -Eqi 'release not found|HTTP 404|status.?404' "$error"; then
              printf 'missing\n'
            else
              cat "$error" >&2
              printf 'unknown\n'
            fi
          }

          title=${RELEASE_TITLE:-$TAG}
          args=(--repo "$GITHUB_REPOSITORY" --draft --title "$title")
          if [[ "$GENERATE_NOTES" == "true" ]]; then
            args+=(--generate-notes)
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          for attempt in 1 2 3; do
            state=$(release_state)
            case "$state" in
              draft)
                echo "release ${TAG} draft already exists; reusing it"
                exit 0
                ;;
              published)
                echo "release ${TAG} already exists and is published; bump the crate version before releasing" >&2
                exit 1
                ;;
              missing)
                set +e
                timeout -k 5 "${RELEASE_GH_TIMEOUT_SECONDS:-120}" \
                  gh release create "$TAG" "${args[@]}"
                create_status=$?
                set -e
                state=$(release_state)
                if [[ "$state" == draft ]]; then
                  ((create_status == 0)) || echo "release ${TAG} appeared after an ambiguous create error"
                  exit 0
                fi
                ;;
              unknown)
                echo "release ${TAG} state is unknown; deferring creation" >&2
                ;;
            esac
            if ((attempt < 3)); then
              delay=${delays[attempt - 1]:-3}
              echo "retrying release draft reconciliation ($((attempt + 1))/3) in ${delay}s" >&2
              sleep "$delay"
            fi
          done
          echo "release ${TAG} draft creation failed after 3 reconciled attempts" >&2
          exit 1

  build:
    name: Build ${{ matrix.asset-platform }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    # Asset upload is the only write operation in this job.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rust-target: x86_64-unknown-linux-musl
            asset-platform: linux-x86_64-musl
            enabled: true
          - os: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-musl
            asset-platform: linux-aarch64-musl
            enabled: true
          - os: ubuntu-24.04
            rust-target: aarch64-linux-android
            asset-platform: android-aarch64
            enabled: ${{ inputs.android-aarch64 }}
          - os: ubuntu-24.04
            rust-target: x86_64-linux-android
            asset-platform: android-x86_64
            enabled: ${{ inputs.android-x86_64 }}
          - os: macos-15-intel
            rust-target: x86_64-apple-darwin
            asset-platform: macos-x86_64
            enabled: true
          - os: macos-latest
            rust-target: aarch64-apple-darwin
            asset-platform: macos-aarch64
            enabled: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.enabled
        with:
          persist-credentials: false

      - name: Install Rust
        if: matrix.enabled
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          targets: ${{ matrix.rust-target }}

      - name: Configure Android NDK toolchain
        if: >-
          matrix.enabled &&
          (matrix.rust-target == 'aarch64-linux-android' ||
          matrix.rust-target == 'x86_64-linux-android')
        uses: cgraf78/actions/.github/actions/android-rust-toolchain@c85e9ce537ffdf1e4a45977dc12be8e63b862c57
        with:
          rust-target: ${{ matrix.rust-target }}

      # This workflow owns the release matrix, so it owns that matrix's linker
      # prerequisites. The toolchain action already added the target, so only
      # the musl linker is missing. Opt-in because repos whose crates are pure
      # Rust link musl targets without it.
      - name: Install musl build prerequisites
        if: >-
          matrix.enabled && inputs.install-musl-tools &&
          endsWith(matrix.rust-target, '-musl')
        uses: cgraf78/actions/.github/actions/musl-build-prereqs@c85e9ce537ffdf1e4a45977dc12be8e63b862c57

      - name: Run repo setup
        if: matrix.enabled && inputs.setup-command != ''
        shell: bash
        env:
          ASSET_PLATFORM: ${{ matrix.asset-platform }}
          RUST_TARGET: ${{ matrix.rust-target }}
          SETUP_COMMAND: ${{ inputs.setup-command }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          cd "$WORKING_DIRECTORY"
          eval "$SETUP_COMMAND"

      - name: Package archive
        if: matrix.enabled
        shell: bash
        env:
          ASSET_PLATFORM: ${{ matrix.asset-platform }}
          PACKAGE_COMMAND: ${{ inputs.package-command }}
          RUST_TARGET: ${{ matrix.rust-target }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        # Packaging remains repo-owned because binary names, metadata files, and
        # archive layout are release contract decisions.
        run: |
          cd "$WORKING_DIRECTORY"
          eval "$PACKAGE_COMMAND"

      - name: Smoke install
        if: matrix.enabled && inputs.smoke-command != ''
        shell: bash
        env:
          ASSET_PLATFORM: ${{ matrix.asset-platform }}
          RUST_TARGET: ${{ matrix.rust-target }}
          SMOKE_COMMAND: ${{ inputs.smoke-command }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          cd "$WORKING_DIRECTORY"
          eval "$SMOKE_COMMAND"

      - name: Upload release assets
        if: matrix.enabled
        uses: cgraf78/actions/.github/actions/upload-release-assets@c85e9ce537ffdf1e4a45977dc12be8e63b862c57
        with:
          asset-glob: ${{ inputs.asset-glob }}
          github-token: ${{ github.token }}
          tag: ${{ github.ref_name }}
          working-directory: ${{ inputs.working-directory }}

  publish-release:
    name: Publish release
    if: inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ inputs.latest }}
          TAG: ${{ github.ref_name }}
        run: |-
          retry_delays=${RELEASE_GH_RETRY_DELAYS:-1,3}
          IFS=, read -r -a delays <<<"$retry_delays"
          error=$(mktemp)
          trap 'rm -f "$error"' EXIT

          release_state() {
            local is_draft status
            set +e
            is_draft=$(timeout -k 5 "${RELEASE_GH_TIMEOUT_SECONDS:-120}" \
              gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq .isDraft 2>"$error")
            status=$?
            set -e
            if ((status == 0)); then
              [[ "$is_draft" == true ]] && printf 'draft\n' || printf 'published\n'
            else
              cat "$error" >&2
              printf 'unknown\n'
            fi
          }

          args=(--repo "$GITHUB_REPOSITORY" --draft=false)
          if [[ "$LATEST" == "true" ]]; then
            args+=(--latest)
          fi

          for attempt in 1 2 3; do
            state=$(release_state)
            if [[ "$state" == published ]]; then
              echo "release ${TAG} is published"
              exit 0
            fi
            if [[ "$state" == draft ]]; then
              set +e
              timeout -k 5 "${RELEASE_GH_TIMEOUT_SECONDS:-120}" \
                gh release edit "$TAG" "${args[@]}"
              edit_status=$?
              set -e
              state=$(release_state)
              if [[ "$state" == published ]]; then
                ((edit_status == 0)) || echo "release ${TAG} published after an ambiguous edit error"
                exit 0
              fi
            else
              echo "release ${TAG} state is unknown; deferring publication" >&2
            fi
            if ((attempt < 3)); then
              delay=${delays[attempt - 1]:-3}
              echo "retrying release publication reconciliation ($((attempt + 1))/3) in ${delay}s" >&2
              sleep "$delay"
            fi
          done
          echo "release ${TAG} publication failed after 3 reconciled attempts" >&2
          exit 1
