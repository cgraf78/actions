# Internal reusable workflow for Rust repos.
#
# Public callers should use `rust-ci.yml`. This worker exists because GitHub
# reusable workflows must live under `.github/workflows`; the smaller
# single-purpose actions it composes live under `.github/actions`.

name: Rust Platforms

on:
  workflow_call:
    inputs:
      matrix-set:
        description: Platform matrix to run. Supported values are core and full.
        required: true
        type: string
      rust-toolchain:
        description: Rust toolchain to install for all checks.
        required: false
        type: string
        default: stable
      working-directory:
        description: Directory where cargo commands should run.
        required: false
        type: string
        default: .
      setup-command:
        description: Optional setup command to run after Rust installation and before tests.
        required: false
        type: string
        default: ""
      profiles:
        description: Optional portable dependency profiles for integration tests.
        required: false
        type: string
        default: ""
      test-command:
        description: Rust test command to run on every selected platform.
        required: false
        type: string
        default: cargo test --locked
      test-shards:
        description: Optional JSON array of {"name", "command"} test shards run as separate jobs on every platform instead of test-command.
        required: false
        type: string
        default: ""
    secrets:
      DEPENDENCY_GH_TOKEN:
        description: Optional GitHub token exposed to caller commands as GH_TOKEN and GITHUB_TOKEN for private dependency downloads or rate-limit avoidance.
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  select-platforms:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - name: Select platform matrix
        id: platforms
        # This action is the shared OS policy used by shell, Rust, and future
        # language-specific CI workflows. Rust owns only the language setup and
        # commands below.
        uses: cgraf78/actions/.github/actions/platform-matrix@b93184588d4631149766a1faf5279f75e38bc09b
        with:
          matrix-set: ${{ inputs.matrix-set }}

      - name: Apply test shards
        id: shards
        shell: bash
        env:
          PLATFORM_MATRIX: ${{ steps.platforms.outputs.matrix }}
          TEST_SHARDS: ${{ inputs.test-shards }}
        # A serial test command bounds each platform job by the sum of its
        # suites. Crossing every platform with caller-named shards runs them
        # as parallel jobs instead, so the slowest shard sets the critical
        # path. Without shards the platform matrix passes through unchanged,
        # preserving existing job names and behavior for every other caller.
        # Validate strictly: a malformed list must fail loudly rather than
        # silently dropping coverage.
        run: |-
          set -euo pipefail

          if [[ -z "$TEST_SHARDS" ]]; then
            echo "matrix=$PLATFORM_MATRIX" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! jq -e '
            type == "array" and length > 0 and
            all(.[]; type == "object" and
              (keys | sort) == ["command", "name"] and
              (.name | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9 ._-]*$")) and
              (.command | type == "string" and test("\\S"))) and
            ([.[].name] | unique | length) == length
          ' <<<"$TEST_SHARDS" >/dev/null; then
            echo 'test-shards must be a non-empty JSON array of objects with a unique name and a non-blank command' >&2
            exit 2
          fi

          matrix=$(jq -c --argjson shards "$TEST_SHARDS" \
            '{include: [.include[] as $platform | $shards[] |
              $platform + {shard: .name, "shard-command": .command}]}' \
            <<<"$PLATFORM_MATRIX")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  platform:
    needs: select-platforms
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-platforms.outputs.matrix) }}

    name: ${{ matrix.shard && format('{0} / {1}', matrix.name, matrix.shard) || matrix.name }}
    steps:
      - name: Install OS prerequisites
        uses: cgraf78/actions/.github/actions/rust-ci-prereqs@b93184588d4631149766a1faf5279f75e38bc09b
        with:
          matrix-name: ${{ matrix.name }}

      # Rust repositories sometimes own shell/Lua integration tests in
      # addition to Cargo tests. Reuse the same named package profiles as
      # shell-ci instead of making each consumer duplicate an OS matrix.
      - name: Install test prerequisites
        if: inputs.profiles != ''
        uses: cgraf78/actions/.github/actions/shell-ci-prereqs@b93184588d4631149766a1faf5279f75e38bc09b
        with:
          matrix-name: ${{ matrix.name }}
          profiles: ${{ inputs.profiles }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false

      - name: Simulate WSL environment
        if: matrix.name == 'WSL'
        run: |
          echo 'Linux version 5.15.0 (Microsoft@Microsoft.com)' > /tmp/wsl-proc-version
          sudo mount --bind /tmp/wsl-proc-version /proc/version

      - name: Mark workspace as safe for git
        # Container ownership can differ from the checkout owner. Trust only the
        # current workspace so repo-aware build scripts/tests can use git.
        run: git config --global --add safe.directory "$(pwd)"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        # GitHub runs container jobs as root with HOME=/github/home while
        # root's passwd entry says /root. rustup-init reads that as a possible
        # `sudo` mistake and prints three `error:` lines, but it only warns
        # under the action's `-y`. The install deliberately follows $HOME,
        # which also holds the CARGO_HOME the action exports, so skip just
        # that check instead of moving HOME and every later Rust path.
        env:
          RUSTUP_INIT_SKIP_SUDO_CHECK: "yes"
        with:
          toolchain: ${{ inputs.rust-toolchain }}

      - name: Run repo setup
        if: inputs.setup-command != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
          MATRIX_NAME: ${{ matrix.name }}
          SETUP_COMMAND: ${{ inputs.setup-command }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        # A generic hook keeps repo-specific package/bootstrap logic out of the
        # shared workflow. Callers can branch on MATRIX_NAME when needed.
        run: |
          cd "$WORKING_DIRECTORY"
          eval "$SETUP_COMMAND"

      - name: Run Rust tests
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
          MATRIX_NAME: ${{ matrix.name }}
          TEST_COMMAND: ${{ matrix.shard && matrix['shard-command'] || inputs.test-command }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        # Keep the caller in charge of the exact cargo invocation while avoiding
        # GitHub expression interpolation in the shell script body.
        run: |-
          cd "$WORKING_DIRECTORY"
          eval "$TEST_COMMAND"
