# Internal reusable workflow for shell repos.
#
# GitHub only allows `workflow_call` reusable workflows to live under
# `.github/workflows`, so this cannot move under `.github/actions` like the
# composite actions it uses. Public callers should use `shell-ci.yml`;
# this file is the shell-specific worker that expands the shared OS matrix and
# runs the caller's shell test command on each platform.

name: Shell Platforms

on:
  workflow_call:
    inputs:
      force-dotfiles-update:
        description: Refresh the shdeps bootstrap before dotfiles dependency resolution.
        required: false
        type: boolean
        default: false
      dotfiles-provider:
        description: Run the configured Dot dependency provider during dotfiles setup.
        required: false
        type: boolean
        default: false
      matrix-set:
        description: Platform matrix to run. Supported values are core and full.
        required: true
        type: string
      profiles:
        description: Comma-separated dependency profiles for normal shell-tool repos.
        required: false
        type: string
        default: ""
      setup:
        description: Named setup mode. Supported values are none, checkrun, and dotfiles.
        required: false
        type: string
        default: none
      test-command:
        description: Command to run after checkout and setup.
        required: true
        type: string
    secrets:
      DEPENDENCY_GH_TOKEN:
        description: Optional GitHub token exposed to caller commands as GH_TOKEN and GITHUB_TOKEN for private dependency downloads or rate-limit avoidance.
        required: false

permissions:
  contents: read

jobs:
  select-platforms:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - name: Select platform matrix
        id: platforms
        # This neutral action is the OS-matrix source of truth. Future Rust,
        # C++, or other reusable workflows should call the same action, then
        # run language-specific setup/tests against the returned matrix.
        uses: cgraf78/actions/.github/actions/platform-matrix@761a286a8f06396e07339f7247eb350e172dfdce
        with:
          matrix-set: ${{ inputs.matrix-set }}

  platform:
    needs: select-platforms
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-platforms.outputs.matrix) }}

    name: ${{ matrix.name }}
    steps:
      - name: Install OS prerequisites
        # Keep first-party prerequisites pinned so an outer reusable-workflow
        # SHA controls every executable action in the call graph.
        uses: cgraf78/actions/.github/actions/shell-ci-prereqs@761a286a8f06396e07339f7247eb350e172dfdce
        with:
          matrix-name: ${{ matrix.name }}
          profiles: ${{ inputs.profiles }}
          setup: ${{ inputs.setup }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Avoid persisting read-only CI credentials into .git/config where
          # repo tests or helper scripts could accidentally reuse them.
          persist-credentials: false

      - name: Simulate WSL environment
        if: matrix.name == 'WSL'
        run: |
          echo 'Linux version 5.15.0 (Microsoft@Microsoft.com)' > /tmp/wsl-proc-version
          sudo mount --bind /tmp/wsl-proc-version /proc/version

      - name: Set HOME to workspace
        # These repos install/discover tools under HOME during tests. Point HOME
        # at the workspace so generated state stays inside the checked-out repo.
        run: echo "HOME=$(pwd)" >> "$GITHUB_ENV"

      - name: Mark workspace as safe for git
        # Container ownership can differ from the checkout owner. Trust only the
        # current workspace so repo-aware tests work without broad Git trust.
        run: git config --global --add safe.directory "$(pwd)"

      - name: Configure Checkrun tool lock
        if: inputs.setup == 'checkrun' && matrix.name != 'Alpine'
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/mise/mise.lock || {
            echo "missing Checkrun CI tool lock: .github/mise/mise.lock" >&2
            exit 1
          }
          {
            echo "MISE_GLOBAL_CONFIG_ROOT=$PWD/.github/mise"
            echo "MISE_LOCKED=1"
          } >>"$GITHUB_ENV"

      - name: Cache checkrun dev tools
        if: inputs.setup == 'checkrun' && matrix.name != 'Alpine'
        # actions/cache v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .local/share/mise
            .cache/mise
            .cache/aqua
            .cache/ubi
          key: checkrun-dev-tools-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-${{ hashFiles('.github/mise/checkrun-ci.toml', '.github/mise/mise.lock') }}
          restore-keys: |
            checkrun-dev-tools-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-

      - name: Install pinned Mise
        if: (inputs.setup == 'checkrun' || inputs.setup == 'dotfiles') && matrix.name != 'Alpine'
        # Checkrun and dotfiles use different committed tool locks but share
        # this one reviewed Mise runtime. Alpine deliberately keeps the smaller
        # historical prerequisite-only path.
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.7.11
          install: false
          cache: false

      - name: Set up Checkrun dev tools
        if: inputs.setup == 'checkrun' && matrix.name != 'Alpine'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          retry() {
            local attempt rc delay
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi

              rc=$?
              if [[ "$attempt" -eq 3 ]]; then
                return "$rc"
              fi

              delay=$((attempt * 15))
              echo "$* failed (attempt $attempt/3, exit $rc); retrying in ${delay}s..." >&2
              sleep "$delay"
            done
          }

          export MISE_GLOBAL_CONFIG_FILE="$PWD/.github/mise/checkrun-ci.toml"
          export MISE_GITHUB_TOKEN="$GITHUB_TOKEN"
          echo "MISE_GLOBAL_CONFIG_FILE=$MISE_GLOBAL_CONFIG_FILE" >>"$GITHUB_ENV"
          mise trust "$MISE_GLOBAL_CONFIG_FILE" >/dev/null || true
          retry mise install --locked

          python3 -m venv "$HOME/.venv"
          "$HOME/.venv/bin/python" -m pip install --upgrade pip
          "$HOME/.venv/bin/python" -m pip install clang-format jsonschema PyYAML tomli

          curl https://sh.rustup.rs -sSf | sh -s -- \
            -y --profile minimal --component rustfmt

          {
            echo "$HOME/.local/bin"
            echo "$HOME/.local/share/mise/shims"
            echo "$HOME/.venv/bin"
            echo "$HOME/.cargo/bin"
          } >>"$GITHUB_PATH"

      - name: Cache dotfiles dependency installs
        if: inputs.setup == 'dotfiles'
        # actions/cache v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .local/share/shdeps
            .local/share/mise
            .cache/mise
            .cache/aqua
            .cache/ubi
          key: dot-deps-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('.config/mise/config.toml', '.config/mise/mise.lock', '.config/shdeps/**/*.conf', '.config/shdeps/hooks.d/**/*') }}
          restore-keys: |
            dot-deps-${{ runner.os }}-${{ matrix.name }}-

      - name: Configure lightweight dotfiles bootstrap
        if: inputs.setup == 'dotfiles' && !inputs.dotfiles-provider
        shell: bash
        # Shared consumers normally need only the declared CI profiles. Keep
        # their bootstrap small, while allowing the dotfiles owner to opt into
        # its complete provider policy for end-to-end dependency tests.
        run: echo "DOT_INIT_SKIP_PROVIDER=1" >> "$GITHUB_ENV"

      - name: Bootstrap dotfiles dependencies
        if: inputs.setup == 'dotfiles'
        uses: cgraf78/actions/.github/actions/dotfiles-bootstrap@761a286a8f06396e07339f7247eb350e172dfdce
        env:
          # The explicit cross-repository token wins for private dependencies.
          # Full-provider public CI still needs authenticated release metadata:
          # parallel clean platforms otherwise share GitHub's 60/hour anonymous
          # quota. Shdeps already defines GH_TOKEN before GITHUB_TOKEN, so this
          # fallback changes nothing when the caller supplies a stronger token.
          GH_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
          GITHUB_TOKEN: ${{ inputs.dotfiles-provider && github.token || '' }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
          MATRIX_NAME: ${{ matrix.name }}
          SHDEPS_FORCE: ${{ inputs.force-dotfiles-update && '1' || '0' }}

      - name: Run tests
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.DEPENDENCY_GH_TOKEN }}
          TEST_COMMAND: ${{ inputs.test-command }}
        # Passing the caller-owned command through env avoids GitHub expression
        # template injection while keeping each repo in charge of its test script.
        #
        # Run the command in this step's Bash process instead of spawning a
        # nested `bash -lc`. GitHub Actions has already selected the best bash
        # on PATH for this step and has already applied GITHUB_PATH additions
        # from setup actions. A nested login shell can rebuild PATH on macOS and
        # in containers, which made tests accidentally pick system Bash or
        # system formatter binaries instead of the versions installed earlier.
        run: eval "$TEST_COMMAND"
