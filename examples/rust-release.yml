name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: read

jobs:
  release:
    # The called workflow narrows write access to release creation, provenance,
    # and upload steps. GitHub does not let it elevate permissions across this
    # boundary, so the caller must grant every permission the release uses.
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: cgraf78/actions/.github/workflows/rust-release.yml@FULL_COMMIT_SHA
    with:
      tag-command: scripts/release-tag.sh
      package-command: scripts/package-release.sh "$RUST_TARGET" "$ASSET_PLATFORM"
      smoke-command: scripts/smoke-release.sh "$ASSET_PLATFORM"
