# shellcheck shell=bash
# shellcheck disable=SC2034  # consumed by the vendored release library

# This file is consumer policy. consumer-ci/sync.sh sees it and vendors the
# provider-owned release scripts plus their managed manifest beside it.
RELEASE_ENV_PREFIX=EXAMPLE_TOOL
RELEASE_SLUG=example-tool
RELEASE_REPO=example/example-tool
RELEASE_ASSET_NAME=example-tool
RELEASE_BINARY=example-tool
RELEASE_BINARY_DEST=example-tool
RELEASE_PAYLOAD_FILES=(README.md LICENSE)
RELEASE_PAYLOAD_DIRS=(completions man)

# Generate a self-contained top-level install.sh for users who do not bootstrap
# through shdeps. Repositories with an existing product-specific installer leave
# this unset and retain ownership of their current install.sh.
RELEASE_STANDALONE_INSTALLER=true
